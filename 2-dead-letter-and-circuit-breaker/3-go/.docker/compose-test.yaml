name: dead-letter-circuit-breaker-go-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: 2-dlcb-go-postgres
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - dlcb-go-net

  redis:
    image: redis:7-alpine
    container_name: 2-dlcb-go-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - dlcb-go-net

  emitter:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: 2-dlcb-go-emitter
    environment:
      PORT: 3000
      POSTGRES_URL: postgres://webhook:webhook@postgres:5432/webhook
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dlcb-go-net

networks:
  dlcb-go-net:
    driver: bridge
