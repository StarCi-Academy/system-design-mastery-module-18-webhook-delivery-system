name: dead-letter-circuit-breaker-java-test

services:
  postgres:
    image: postgres:16-alpine
    container_name: 2-dlcb-java-postgres
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - dlcb-java-net

  redis:
    image: redis:7-alpine
    container_name: 2-dlcb-java-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - dlcb-java-net

  emitter:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: 2-dlcb-java-emitter
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: webhook
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dlcb-java-net

networks:
  dlcb-java-net:
    driver: bridge
