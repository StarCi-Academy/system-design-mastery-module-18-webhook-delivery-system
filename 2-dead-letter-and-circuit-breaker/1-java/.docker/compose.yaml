name: dead-letter-circuit-breaker-java

services:
  postgres:
    image: postgres:16-alpine
    container_name: 2-dead-letter-and-circuit-breaker-java-postgres
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - webhook-network

  redis:
    image: redis:7-alpine
    container_name: 2-dead-letter-and-circuit-breaker-java-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - webhook-network

  emitter:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: 2-dead-letter-and-circuit-breaker-java-emitter
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: webhook
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webhook-network

networks:
  webhook-network:
    driver: bridge
