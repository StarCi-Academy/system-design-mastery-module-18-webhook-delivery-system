# SELF-BUILD ONLY: app services use build: (local Dockerfile); brokers use official image:.
name: mig-20-webhook-delivery-system-1-outbox-and-idempotent-delivery-csharp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  receiver-mock:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["receiver"]
    environment:
      PORT: "3000"
      ConnectionStrings__Redis: "redis:6379"
      FailFirstNAttempts: "2"
    depends_on:
      redis:
        condition: service_healthy

  emitter:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Username=app;Password=app;Database=app"
      ReceiverUrl: "http://receiver-mock:3000/api/hook"
    ports:
      - "${EMITTER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      receiver-mock:
        condition: service_started
